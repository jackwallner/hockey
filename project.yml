name: StatScout
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.91.0
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  lastUpgradeCheck: "1600"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  StatScout:
    type: application
    platform: iOS
    sources:
      - path: StatScout
        excludes:
          - Data/*.json
    resources:
      - StatScout/PrivacyInfo.xcprivacy
      - StatScout/Data/players-historical.plist
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.hockey
        PRODUCT_NAME: "Hockey StatScout"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StatScout/Info.plist
        CODE_SIGN_ENTITLEMENTS: StatScout/StatScout.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          SUPABASE_URL: $(SUPABASE_URL)
          SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(PROVISIONING_PROFILE_SPECIFIER)
          SUPABASE_URL: $(SUPABASE_URL)
          SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    preBuildScripts:
      - name: Pre-build validation
        basedOnDependencyAnalysis: false
        script: |
          if ! command -v xcodegen &> /dev/null; then
            echo "warning: xcodegen not found. Install via 'brew install xcodegen'."
          fi
          if [ "$PLATFORM_NAME" != "iphonesimulator" ]; then
            if [ -z "$SUPABASE_URL" ]; then
              echo "error: SUPABASE_URL not set."
              exit 1
            fi
            if [ -z "$SUPABASE_ANON_KEY" ]; then
              echo "error: SUPABASE_ANON_KEY not set."
              exit 1
            fi
          fi
    postBuildScripts:
      - name: Embed simulator Testing interop
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            source="${PLATFORM_DEVELOPER_USR_DIR}/lib/lib_TestingInterop.dylib"
            destination="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/lib_TestingInterop.dylib"
            if [ -f "$source" ]; then
              mkdir -p "$(dirname "$destination")"
              cp "$source" "$destination"
            fi
          fi
    entitlements:
      path: StatScout/StatScout.entitlements
    dependencies:
      - package: RevenueCat
      - sdk: XCTest.framework
        weak: true

  StatScoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StatScoutTests
      # Test bundle only - the app never ships it, so the store it talks to on
      # a device is the real one. SKTestSession loads it by URL from here, which
      # is what lets the paywall-copy tests run under plain `xcodebuild test`
      # without the scheme's StoreKit setting or the UI-test runner (broken on
      # the shared agent-sim pool).
      - path: StatScout.storekit
        buildPhase: resources
    dependencies:
      - target: StatScout
      - package: RevenueCat
      - sdk: StoreKitTest.framework
        weak: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hockey StatScout.app/Hockey StatScout"

  StatScoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StatScoutUITests
    dependencies:
      - target: StatScout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StatScout
    postBuildScripts:
      - name: Embed simulator Testing interop
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            source="${PLATFORM_DEVELOPER_USR_DIR}/lib/lib_TestingInterop.dylib"
            runner="${BUILT_PRODUCTS_DIR}/${TARGET_NAME}-Runner.app/Frameworks/lib_TestingInterop.dylib"
            if [ -f "$source" ]; then
              mkdir -p "$(dirname "$runner")"
              cp "$source" "$runner"
            fi
          fi

schemes:
  # UI tests, on their own scheme so the default `xcodebuild test -scheme
  # StatScout` run stays unit-only and the app is NOT built as a
  # unit-test host. The StatScout scheme includes StatScoutTests, which makes
  # Xcode embed Testing.framework and the XCTest frameworks into the app bundle
  # and requires the simulator's Testing interop runtime. The target build
  # scripts stage that runtime into the app and UI-test runner only on simulator.
  StatScoutUITests:
    build:
      targets:
        StatScout: all
        StatScoutUITests: [test]
    test:
      config: Debug
      targets:
        - StatScoutUITests
    run:
      config: Debug

  StatScout:
    build:
      targets:
        StatScout: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StatScoutTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
