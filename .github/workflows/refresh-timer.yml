name: NHL Refresh Timer

# Sleeps until the next moment the schedule planner asked for, then starts the
# refresh workflow. GitHub's cron is best effort and has skipped hours at a time,
# so each refresh run books its own successor here.
# Only the newest timer survives: a newer plan cancels the older sleep.
on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "Seconds to wait before starting the refresh workflow"
        required: true
        default: "900"

concurrency:
  group: nhl-refresh-timer
  cancel-in-progress: true

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
      contents: read
    steps:
      - name: Sleep until the planned check
        env:
          WAIT: ${{ inputs.wait_seconds }}
        run: |
          wait="${WAIT//[^0-9]/}"
          wait="${wait:-900}"
          # A job can run six hours. Wake early instead; the planner books the
          # rest of the wait on the next hop.
          if [ "$wait" -gt 20400 ]; then wait=20400; fi
          echo "Sleeping ${wait}s"
          sleep "$wait"

      - name: Start the refresh workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One GitHub API 504 here used to end the chain until a backup cron fired.
          for attempt in 1 2 3 4 5; do
            if gh workflow run nightly-statcast.yml --repo "$GITHUB_REPOSITORY" -f planned=true; then
              exit 0
            fi
            echo "Dispatch attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          exit 1
