name: NHL Enrichment

# Player profiles, team ratings and game projections rebuild once a night in
# season (October to June), after MoneyPuck's overnight regeneration. Writes only
# the enrichment tables. The job body still runs the football-era script and is
# replaced by the enrichment port.
on:
  schedule:
    - cron: "0 11 * 10-12,1-6 *"
  workflow_dispatch:

concurrency:
  group: nhl-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Build player profiles and team ratings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
        run: python backend/ingest_enrichment.py
