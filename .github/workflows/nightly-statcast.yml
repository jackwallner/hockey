name: NHL Refresh

on:
  schedule:
    # Backup only. The primary cadence is the self-booked refresh-timer chain:
    # each run asks backend/refresh_schedule.py when the next probe or schedule
    # sync is due and books that moment. GitHub's cron is best effort, so these
    # entries restart a broken chain. In season (October to June) it fires every
    # 30 minutes and the planner turns most firings into a no-op; July to
    # September it fires once a day. Odd minutes avoid GitHub's top-of-hour
    # scheduling backlog.
    - cron: "7,37 * * 10-12,1-6 *"
    - cron: "13 10 * 7-9 *"
  workflow_dispatch:
    inputs:
      planned:
        description: "Started by the refresh timer; let the planner decide instead of forcing"
        type: boolean
        default: false
      force:
        description: "Run a full current-season refresh even when source metadata is unchanged"
        type: boolean
        default: false
      full_game_log_reingest:
        description: "Rebuild every final game log of the live season, not just new finals"
        type: boolean
        default: false
      backfill_seasons:
        description: "Re-ingest a season range as well, e.g. 2018-2025 (needed after adding a metric source)"
        type: string
        default: ""
      rollup_all_time:
        description: "Rebuild the All Time career rollup (season 0)"
        type: boolean
        default: false

# STATCAST_SEASON is passed through empty unless the repo variable is set.
# Empty keeps the calendar resolver: year if month >= 9, otherwise year - 1.

concurrency:
  group: nhl-data-refresh
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      season: ${{ steps.source-probe.outputs.season }}
      ready: ${{ steps.source-probe.outputs.ready }}
      changed: ${{ steps.source-probe.outputs.changed }}
      refresh_id: ${{ steps.source-probe.outputs.refresh_id }}
      fingerprint: ${{ steps.source-probe.outputs.fingerprint }}
      wait_seconds: ${{ steps.plan.outputs.wait_seconds }}
      source_published_at: ${{ steps.source-probe.outputs.source_published_at }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Stdlib only, on the runner's own python3, so a skipped firing costs a
      # checkout and a few small requests. It also keeps the games table
      # (schedule and final scores) in sync for the app's Games tab.
      - name: Plan from the NHL schedule
        id: plan
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && !inputs.planned }}
        run: |
          args=()
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--force)
          fi
          python3 backend/refresh_schedule.py --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Set up Python
        if: steps.plan.outputs.probe == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe MoneyPuck source generations
        if: steps.plan.outputs.probe == 'true'
        id: source-probe
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          FORCE_REFRESH: ${{ inputs.force || inputs.full_game_log_reingest || inputs.backfill_seasons != '' || inputs.rollup_all_time }}
        run: |
          set -o pipefail
          args=()
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--force)
          fi
          python backend/source_probe.py --github-output "$GITHUB_OUTPUT" "${args[@]}" 2>&1 | tee source_probe.log

  refresh:
    if: needs.probe.outputs.changed == 'true'
    needs: probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # The refresh is incremental for game logs and small for everything else.
    # Keep room for an explicit historical backfill or career rollup below.
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Player bios (30-day TTL) and finished-season downloads, so the
      # enrichment step below does not refetch about 700 bios on every run.
      - name: Restore cached bios and finished-season files
        uses: actions/cache@v4
        with:
          path: backend/.cache
          key: nhl-cache-${{ steps.week.outputs.week }}
          restore-keys: nhl-cache-

      # The backend tests run in CI (ci.yml) on every push; repeating them here
      # would only delay the publish.
      - name: Build and atomically publish current season
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          REFRESH_ID: ${{ needs.probe.outputs.refresh_id }}
          SEASON: ${{ needs.probe.outputs.season }}
          FULL_LOGS: ${{ inputs.full_game_log_reingest }}
        run: |
          set -o pipefail
          args=()
          if [ "$FULL_LOGS" = "true" ]; then
            args+=(--full-logs)
          fi
          python backend/refresh.py --refresh-id "$REFRESH_ID" --season "$SEASON" "${args[@]}" 2>&1 | tee refresh.log

      # Game pages (cumulative xG race, team and player lines): builds finals
      # that have no game_details row yet and re-ranks the stored ones. Runs
      # after the atomic publish (or its unchanged no-op); a failure here must
      # not fail the refresh, the next run picks the missing games up.
      - name: Build advanced game details
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: ${{ needs.probe.outputs.season }}
        run: |
          set -o pipefail
          python backend/ingest_game_details.py --season "$SEASON" 2>&1 | tee game_details.log

      # Player profiles, team ratings and game projections. Separate tables, so
      # a failure here never touches the published snapshots; the nightly
      # enrichment workflow retries it.
      - name: Build player profiles and team ratings
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: ${{ needs.probe.outputs.season }}
        run: |
          set -o pipefail
          python backend/ingest_enrichment.py --season "$SEASON" 2>&1 | tee enrichment.log

      # Adding a metric source only reaches seasons explicitly requested.  The
      # event path above remains current-season only and does not rewrite the
      # historical bundle or career rollup on every probe.
      - name: Backfill season range
        if: inputs.backfill_seasons != ''
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RANGE: ${{ inputs.backfill_seasons }}
        run: |
          set -o pipefail
          FIRST="${RANGE%%-*}"
          LAST="${RANGE##*-}"
          if ! [[ "$FIRST" =~ ^[0-9]{4}$ && "$LAST" =~ ^[0-9]{4}$ ]]; then
            echo "backfill_seasons must look like 2018-2025 (got '$RANGE')" >&2
            exit 1
          fi
          if [ "$FIRST" -gt "$LAST" ]; then
            echo "backfill_seasons range is inverted: $RANGE" >&2
            exit 1
          fi
          for season in $(seq "$FIRST" "$LAST"); do
            echo "::group::Backfilling $season"
            python backend/ingest.py --season "$season" --season-type all 2>&1 | tee -a backfill.log
            echo "::endgroup::"
          done

      - name: Rebuild All Time career rollup
        if: inputs.rollup_all_time
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          python backend/rollup_all_time.py --season-type all 2>&1 | tee all_time.log

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-failure-logs
          path: |
            source_probe.log
            refresh.log
            backfill.log
            all_time.log

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'NHL data refresh failed',
              body: ':warning: NHL data refresh failed, check [run logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            })

  # Book the next check. Runs whether or not this run probed or refreshed, so
  # the chain survives a failed build; the backup cron restarts a broken chain.
  schedule-next:
    needs: [probe, refresh]
    if: always() && needs.probe.outputs.wait_seconds != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the refresh timer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT: ${{ needs.probe.outputs.wait_seconds }}
        run: gh workflow run refresh-timer.yml --repo "$GITHUB_REPOSITORY" -f wait_seconds="$WAIT"
